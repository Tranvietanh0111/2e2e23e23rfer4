
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
        }

        header {
            padding: 25px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #00d4ff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
        }

        nav a:hover {
            color: #00d4ff;
        }

        .container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container h1 {
            font-size: 50px;
            margin-bottom: 20px;
        }

        .container span {
            color: #00d4ff;
        }

        .container p {
            font-size: 18px;
            color: #ccc;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 30px;
            border: none;
            border-radius: 30px;
            background: #00d4ff;
            color: #141e30;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
            background: white;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <header>
        <h2>MyWebsite</h2>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Giới thiệu</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <div class="container">
        <h1>Xin chào, tôi là <span>Việt Anh</span></h1>
        <p>Chào mừng bạn đến với website cá nhân của tôi!</p>
        <button onclick="showMessage()">Khám phá ngay</button>
    </div>

    <footer>
        © 2026 MyWebsite. All rights reserved.
    </footer>

    <script>
        function showMessage() {
            alert("Chào mừng bạn đến với website!");
        }
    </script>

</body>
</html>
